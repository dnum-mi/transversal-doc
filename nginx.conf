server {
  listen 8080;
  server_name localhost;
  server_tokens off;
  # Behind the ingress, absolute redirects would expose the internal scheme and port (http://host:8080/...)
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (always: also sent on 4xx/5xx). Do not use add_header in a location block,
  # it would stop these server-level headers from being inherited.
  # $csp_script_hashes is generated at build time (scripts/csp-hashes.mjs) from VitePress inline scripts.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' $csp_script_hashes; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;

  location /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"UP"}';
  }
}

nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: false
  annotations: {}
  name: ""
imageCredentials:
  registry: ""
  username: ""
  password: ""
  email: ""

docs:
  replicaCount: 1
  image:
    repository: ghcr.io/dnum-mi/transversal-doc
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: latest
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # nginx writes its pid file and temporary files in /tmp, which has to stay writable with readOnlyRootFilesystem
  volumes:
    - name: tmp
      emptyDir: {}
  volumeMounts:
    - name: tmp
      mountPath: /tmp
  container:
    port: 8080
    env: {}
    secrets: {}
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: traefik
    annotations:
      "cert-manager.io/cluster-issuer": le-fabnum-prod
    hosts:
      - host: docs.fabrique-numerique.fr
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: docs.fabrique-numerique.fr
        hosts:
          - docs.fabrique-numerique.fr
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}
